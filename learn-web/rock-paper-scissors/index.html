<!DOCTYPE html>
<html>
    <head>
        <title>RPS - rock, paper, scissors</title>
    </head>

    <body>
        <h1>Rock Paper Scissors</h1>
        <div title="rock"></div>
        <div title="paper"></div>
        <div title="scissors"></div>
        <p class="game-status"></p>
        <div>
            <p>
                Wins: <p class="win-status"></p>
            </p>
            <p>
                Losses: <p class="losses-status"></p>
            </p>
            <p>
                Ties: <p class="ties-status"></p>
            </p>
        </div>
        <button>Reset Score</button>
    </body>
</html>
